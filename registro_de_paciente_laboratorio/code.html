<script>
function calcularEdad() {
  var fechaInput = document.getElementById('fecha-nacimiento');
  var edadInput = document.getElementById('edad');
  if (!fechaInput || !edadInput) return;

  if (!fechaInput.value) {
    edadInput.readOnly = false;
    edadInput.value = '';
    edadInput.placeholder = 'Ej. 3 a\u00f1os, 6 meses, 15 d\u00edas';
    return;
  }

  var partes = fechaInput.value.split('-');
  var nacimiento = new Date(+partes[0], +partes[1] - 1, +partes[2]);
  var hoy = new Date();
  hoy.setHours(0, 0, 0, 0);

  var a\u00f1os = hoy.getFullYear() - nacimiento.getFullYear();
  var meses = hoy.getMonth() - nacimiento.getMonth();
  var d\u00edas = hoy.getDate() - nacimiento.getDate();

  if (d\u00edas < 0) {
    meses--;
    var mesAnterior = new Date(hoy.getFullYear(), hoy.getMonth(), 0);
    d\u00edas += mesAnterior.getDate();
  }
  if (meses < 0) {
    a\u00f1os--;
    meses += 12;
  }

  var texto = '';
  if (a\u00f1os > 0) {
    texto = a\u00f1os + (a\u00f1os === 1 ? ' a\u00f1o' : ' a\u00f1os');
  } else if (meses > 0) {
    texto = meses + (meses === 1 ? ' mes' : ' meses');
  } else {
    texto = d\u00edas + (d\u00edas === 1 ? ' d\u00eda' : ' d\u00edas');
  }

  edadInput.value = texto;
  edadInput.readOnly = true;
}
</script>
